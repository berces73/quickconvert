<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>QuickConvert - Hızlı PDF Dönüştürücü</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; text-align: center; padding: 50px; }
        .upload-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; }
        .btn-convert { background: #2ecc71; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 18px; margin-top: 20px; }
        .btn-convert:hover { background: #27ae60; }
        h1 { color: #2c3e50; }
    </style>
</head>
<body>
    <div class="upload-container">
        <h1>QuickConvert</h1>
        <p>PDF dosyanızı seçin ve anında metne dönüştürün.</p>
        <form action="/convert" method="post" enctype="multipart/form-data">
            <input type="file" name="pdf_file" accept=".pdf" required>
            <br>
            <button type="submit" class="btn-convert">Dönüştür ve İndir</button>
        </form>
    </div>
</body>
</html>
