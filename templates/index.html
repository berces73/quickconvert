<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tools - Hızlı ve Ücretsiz</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #38bdf8; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: var(--card); padding: 2rem; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 90%; max-width: 600px; text-align: center; border: 1px solid #334155; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; color: var(--primary); }
        p { color: #94a3b8; margin-bottom: 2rem; }
        .upload-area { border: 2px dashed #334155; padding: 2rem; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .upload-area:hover { border-color: var(--primary); background: #1e293b; }
        input[type="file"] { margin: 1rem 0; color: #94a3b8; }
        button { background: var(--primary); color: #0f172a; border: none; padding: 0.8rem 2rem; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; width: 100%; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.4); }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF Expert 🚀</h1>
        <p>Dosyanızı seçin, metni saniyeler içinde ayıklayalım.</p>
        
        <form method="post" enctype="multipart/form-data">
            <div class="upload-area">
                <input type="file" name="file" accept=".pdf" required>
            </div>
            <br>
            <button type="submit">Dönüştürmeyi Başlat</button>
        </form>

        <div class="footer">
            🔒 Gizlilik Önceliğimizdir: Dosyalar işlendikten sonra anında silinir.
        </div>
    </div>
</body>
</html>
