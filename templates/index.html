<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Akıllı Belge Merkezi</title>
    <style>
        :root { --bg: #05070a; --primary: #38bdf8; --purple: #a855f7; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 50px auto; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; margin-bottom: 20px; transition: 0.3s; }
        .card:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-ai { background: linear-gradient(90deg, var(--primary), var(--purple)); color: white; }
        .btn-text { background: #1f2937; color: white; }
        textarea { width: 100%; height: 200px; background: #000; color: var(--primary); border-radius: 12px; padding: 15px; border: 1px solid #333; margin-top: 20px; }
        .badge { background: var(--primary); color: black; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center; font-size: 3rem; margin-bottom: 10px;">Nexus AI ⚡</h1>
        <p style="text-align:center; color: #666; margin-bottom: 40px;">Hızlı, stabil ve profesyonel belge analiz sistemi.</p>

        <div class="card">
            <span class="badge">PRO PANEL</span>
            <h3>Belge Yükle (PDF veya Word)</h3>
            <form method="post" enctype="multipart/form-data">
                <input type="file" name="file" style="margin: 20px 0; display: block;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <button type="submit" name="action" value="ai_analyze" class="btn btn-ai">✨ AI İle Özetle</button>
                    <button type="submit" name="action" value="just_text" class="btn btn-text">📄 Metne Çevir</button>
                </div>
            </form>
        </div>

        {% if ai_result %}
        <div class="card" style="border-color: var(--purple);">
            <h3 style="color: var(--purple);">✨ Yapay Zeka Özeti</h3>
            <p style="line-height: 1.6; color: #ddd;">{{ ai_result }}</p>
        </div>
        {% endif %}

        {% if text %}
        <div class="card">
            <h3>📄 Belge Metni</h3>
            <textarea readonly>{{ text }}</textarea>
        </div>
        {% endif %}
    </div>
</body>
</html>
