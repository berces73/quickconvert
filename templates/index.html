<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiConvert Pro - Hepsi Bir Arada</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .tool-card { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #334155; transition: 0.3s; }
        .tool-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        h1 { margin-bottom: 40px; color: var(--primary); font-size: 2.5rem; }
        input[type="file"] { margin: 15px 0; font-size: 0.8rem; }
        button { background: var(--primary); color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        textarea { width: 100%; height: 150px; margin-top: 15px; background: #0f172a; color: white; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>
    <h1>MultiConvert Pro 🚀</h1>
    <div class="grid">
        <div class="tool-card">
            <h3>📄 PDF -> Metin</h3>
            <form method="post" enctype="multipart/form-data">
                <input type="hidden" name="action" value="pdf_to_text">
                <input type="file" name="file" accept=".pdf" required>
                <button type="submit">Dönüştür</button>
            </form>
            {% if text %}
            <textarea>{{ text }}</textarea>
            {% endif %}
        </div>

        <div class="tool-card">
            <h3>🖼️ Resim -> PDF</h3>
            <form method="post" enctype="multipart/form-data">
                <input type="hidden" name="action" value="img_to_pdf">
                <input type="file" name="file" accept="image/*" required>
                <button type="submit">Dönüştür ve İndir</button>
            </form>
        </div>
    </div>
    <p style="margin-top: 50px; color: #64748b;">Yeni araçlar yakında eklenecek...</p>
</body>
</html>
